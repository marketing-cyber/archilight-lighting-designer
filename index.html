<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archilight Lighting Planner</title>
<meta name="description" content="Plan your room's lighting with Archilight products and send it for a quote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Italiana&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="site-header">
  <a class="site-logo" href="https://archilight-light-space-scenes.cuddly-elk-3653.chatgpt.site/" aria-label="Archilight home"><img src="assets/logo.png" alt="Archilight" width="400" height="49"></a>
  <p class="eyebrow">Lighting designer</p>
</header>
<main class="designer">
  <section class="stage" aria-label="3D room">
    <div class="stage-bar">
      <p id="hint" class="hint-pill" role="status"></p>
      <span class="stage-tools"><button type="button" class="link" id="undo" disabled>Undo</button><button type="button" class="link" id="reset-view">Reset view</button></span>
    </div>
    <div id="view3d"></div>
    <div class="scene-bar" id="scene-bar"></div>
  </section>
  <div class="side">
    <aside class="brief" id="brief" aria-label="Your space"></aside>
    <aside class="scheme" id="scheme" aria-label="Your lighting scheme" aria-live="polite"></aside>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-see">See it</button></div>
<noscript><p class="notice">The lighting planner needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
